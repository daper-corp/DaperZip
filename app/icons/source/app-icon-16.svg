<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- DaperZip app icon pixel-fitted for exactly 16x16 (one unit = one pixel). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC04A"/>
      <stop offset="1" stop-color="#F0960C"/>
    </linearGradient>
    <clipPath id="clip"><rect width="16" height="16" rx="3.5"/></clipPath>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#tile)" shape-rendering="geometricPrecision"/>
  <g clip-path="url(#clip)">
    <rect x="5" y="0" width="6" height="16" fill="#000000" opacity=".12"/>
    <g fill="#111318">
      <rect x="5" y="0" width="3" height="1"/>
      <rect x="8" y="2" width="3" height="1"/>
      <rect x="5" y="4" width="3" height="1"/>
      <rect x="8" y="6" width="3" height="1"/>
      <rect x="8" y="14" width="3" height="1"/>
    </g>
    <rect x="4" y="7" width="8" height="1" fill="#FFFFFF"/>
    <rect x="5" y="8" width="6" height="1" fill="#FFFFFF"/>
    <rect x="6" y="9" width="4" height="6" fill="#FFFFFF"/>
    <rect x="7" y="11" width="2" height="2" fill="#111318"/>
  </g>
</svg>
