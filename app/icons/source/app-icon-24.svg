<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges">
  <!-- DaperZip app icon pixel-fitted for exactly 24x24 (one unit = one pixel). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC04A"/>
      <stop offset="1" stop-color="#F0960C"/>
    </linearGradient>
    <clipPath id="clip"><rect width="24" height="24" rx="5"/></clipPath>
  </defs>
  <rect width="24" height="24" rx="5" fill="url(#tile)" shape-rendering="geometricPrecision"/>
  <g clip-path="url(#clip)">
    <rect x="8" y="0" width="8" height="24" fill="#000000" opacity=".12"/>
    <g fill="#111318">
      <rect x="8" y="0" width="4" height="1"/>
      <rect x="12" y="2" width="4" height="1"/>
      <rect x="8" y="4" width="4" height="1"/>
      <rect x="12" y="6" width="4" height="1"/>
      <rect x="8" y="8" width="4" height="1"/>
      <rect x="12" y="10" width="4" height="1"/>
      <rect x="12" y="22" width="4" height="1"/>
    </g>
    <rect x="7" y="11" width="10" height="2" fill="#FFFFFF"/>
    <rect x="8" y="13" width="8" height="1" fill="#FFFFFF"/>
    <rect x="9" y="13" width="6" height="8" fill="#FFFFFF"/>
    <rect x="11" y="16" width="2" height="3" fill="#111318"/>
  </g>
</svg>
