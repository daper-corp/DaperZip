name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Build Windows, macOS and Linux (normally only for releases)"
        type: boolean
        default: true

permissions:
  contents: write

# A newer push makes an older, still running build of the same branch
# pointless. (A cancelled release is picked up again by the next push to
# main, because its tag does not exist yet.)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reads the app version and decides whether this push is a new release.
  #
  # Automatic release: when a push to main carries an app version that has no
  # tag yet (e.g. 0.1.1 → no v0.1.1) AND release notes exist in
  # release-notes/v<version>.md, the release job creates tag + release.
  # Bump the version with scripts/bump-version.sh.
  #
  # Speed: ordinary pushes build and test Windows only, with lighter
  # optimisation. All three platforms, fully optimised, are built for
  # releases (new version on main, or a v* tag), pull requests, and manual
  # runs.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.v.outputs.matrix }}
      full: ${{ steps.v.outputs.full }}
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        shell: bash
        run: |
          V=$(jq -r .version app/tauri.conf.json)
          CARGO_V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$V" != "$CARGO_V" ]; then
            echo "::error::Version mismatch: app/tauri.conf.json=$V, Cargo.toml=$CARGO_V (use scripts/bump-version.sh)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # 0.x versions and versions like 1.0.0-beta.1 are pre-releases
          if [[ "$V" == 0.* || "$V" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          NOTES="release-notes/v$V.md"
          RELEASE=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
              echo "v$V is already released."
            elif [ -f "$NOTES" ]; then
              echo "New version v$V with notes → will release after the builds pass."
              RELEASE=true
            else
              echo "::warning::Version $V has no tag yet but $NOTES is missing, so no release is made. Add the notes to release."
            fi
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

          FULL=false
          if [ "$RELEASE" = true ] || [[ "$GITHUB_REF" == refs/tags/v* ]] || [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
             || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.all_platforms }}" != "false" ]; }; then
            FULL=true
          fi
          WIN='{"os":"windows-latest","sevenzip":"windows-x64","args":"--no-bundle"}'
          MAC='{"os":"macos-latest","sevenzip":"macos","args":"--target universal-apple-darwin"}'
          LNX='{"os":"ubuntu-22.04","sevenzip":"linux-x64","args":""}'
          if [ "$FULL" = true ]; then M="[$WIN,$MAC,$LNX]"; else M="[$WIN]"; fi
          echo "matrix={\"include\":$M}" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "Platforms: $([ "$FULL" = true ] && echo 'Windows, macOS, Linux (release optimisation)' || echo 'Windows only (fast build)')"

  build:
    needs: version
    strategy:
      fail-fast: false
      # Windows: --no-bundle, the installer is made with Inno Setup below
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Releases: smallest/fastest binary (fat LTO, 1 codegen unit).
      # Everyday builds: thin LTO + parallel codegen compile much faster.
      CARGO_PROFILE_RELEASE_LTO: ${{ needs.version.outputs.full == 'true' && 'true' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ needs.version.outputs.full == 'true' && '1' || '16' }}
    steps:
      - uses: actions/checkout@v5

      # cached between runs, so apt mirrors are not hit (they sometimes stall)
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
          version: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ needs.version.outputs.full }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 7-Zip is committed under vendor/7zip/ (no download needed); just
      # make sure the binaries are the ones recorded in SHA256SUMS.
      - name: Verify bundled 7-Zip
        shell: bash
        run: |
          cd vendor/7zip
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi

      - name: Test engine against the bundled 7-Zip
        shell: bash
        run: |
          export DAPERZIP_7Z="$PWD/vendor/7zip/${{ matrix.sevenzip }}/$([ "$RUNNER_OS" = "Windows" ] && echo 7z.exe || echo 7zz)"
          cargo test -p daperzip-core

      - name: Build app
        working-directory: app
        run: npx -y @tauri-apps/cli@2 build ${{ matrix.args }}

      # Explorer integration: register / unregister in both scopes and check
      # the registry (runners are admins, so HKLM is writable).
      - name: Check Explorer menu registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-Item target/release/DaperZip.exe -ErrorAction SilentlyContinue) ?? (Get-Item target/release/daperzip.exe)
          foreach ($scope in 'user', 'machine') {
            $hive = if ($scope -eq 'user') { 'HKCU:' } else { 'HKLM:' }
            Start-Process $exe.FullName -ArgumentList "--register-shell=$scope" -Wait
            $cmd = (Get-ItemProperty "$hive\Software\Classes\SystemFileAssociations\.zip\shell\DaperZip.Extract\shell\1smart\command").'(default)'
            $cmd2 = (Get-ItemProperty "$hive\Software\Classes\Directory\shell\DaperZip.Compress\shell\1zip\command").'(default)'
            Write-Host "[$scope] $cmd"
            Write-Host "[$scope] $cmd2"
            if ($cmd -notlike "*--extract-smart*" -or $cmd2 -notlike "*--compress-zip*") { throw "menu not registered ($scope)" }
          }
          Start-Process $exe.FullName -ArgumentList '--unregister-shell' -Wait
          foreach ($hive in 'HKCU:', 'HKLM:') {
            if (Test-Path -LiteralPath "$hive\Software\Classes\*\shell\DaperZip.Compress") { throw "menu not removed ($hive)" }
          }
          Write-Host "Explorer menu register/unregister OK"

      # ---- Windows installer (Inno Setup, installer/daperzip.iss) ----
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $lang = Join-Path (Split-Path $iscc) 'Languages\Korean.isl'
          if (-not (Test-Path $lang)) {
            Invoke-WebRequest 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Korean.isl' -OutFile $lang
          }
          # WebView2 runtime bootstrapper (installed only where missing)
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile installer\MicrosoftEdgeWebview2Setup.exe
          $v = (Get-Content app\tauri.conf.json | ConvertFrom-Json).version
          & $iscc /Qp "/DAppVersion=$v" installer\daperzip.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      - name: Test Windows installer (silent install / uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\DaperZip_*_x64-setup.exe).FullName
          function Check($cond, $msg) { if (-not $cond) { throw $msg } ; Write-Host "OK  $msg" }
          $cases = @(
            @{ Flag = '/CURRENTUSER'; Dir = "$env:LOCALAPPDATA\Programs\DaperZip"; Hive = 'HKCU:' },
            @{ Flag = '/ALLUSERS';    Dir = "$env:ProgramFiles\DaperZip";          Hive = 'HKLM:' }
          )
          foreach ($c in $cases) {
            $log = "$env:RUNNER_TEMP\setup$($c.Flag.Trim('/')).log"
            $p = Start-Process $setup -ArgumentList "$($c.Flag) /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /TASKS=contextmenu,desktopicon /LOG=`"$log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Host "setup exit code: $($p.ExitCode)"; if (Test-Path $log) { Get-Content $log | Select-Object -Last 60 } }
            Check ($p.ExitCode -eq 0) "$($c.Flag): setup exit code 0"
            Check (Test-Path "$($c.Dir)\DaperZip.exe") "$($c.Flag): DaperZip.exe installed in $($c.Dir)"
            Check (Test-Path "$($c.Dir)\7zip\7z.dll") "$($c.Flag): 7-Zip installed"
            $cmd = (Get-ItemProperty "$($c.Hive)\Software\Classes\SystemFileAssociations\.zip\shell\DaperZip.Extract\shell\1smart\command").'(default)'
            Check ($cmd -like "*$($c.Dir)\DaperZip.exe*") "$($c.Flag): right-click menu points to the installed exe"
            Check (Test-Path "$($c.Hive)\Software\Microsoft\Windows\CurrentVersion\Uninstall\{13371C5E-DE99-47B0-8A62-96AC45691B98}_is1") "$($c.Flag): listed in Apps & features"
            $p = Start-Process "$($c.Dir)\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
            Start-Sleep -Seconds 3
            Check (-not (Test-Path "$($c.Dir)\DaperZip.exe")) "$($c.Flag): files removed by uninstall"
            Check (-not (Test-Path -LiteralPath "$($c.Hive)\Software\Classes\*\shell\DaperZip.Compress")) "$($c.Flag): right-click menu removed by uninstall"
          }

      - name: Screenshot Windows installer
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $setup = (Get-ChildItem dist\DaperZip_*_x64-setup.exe).FullName
          New-Item -ItemType Directory -Force shots | Out-Null
          foreach ($lang in 'ko', 'en') {
            $p = Start-Process $setup -ArgumentList "/LANG=$lang" -PassThru
            Start-Sleep -Seconds 8
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\installer-$lang.png")
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -like 'DaperZip_*' -or $_.ProcessName -like '*.tmp' } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }

      - uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: installer-screenshots
          path: shots/*
          if-no-files-found: ignore

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find target -path '*/release/bundle/*' \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist/ \;
          if [ "$RUNNER_OS" = "Windows" ]; then
            # portable build: DaperZip.exe + 7zip folder, no installer needed
            mkdir -p portable/DaperZip/7zip
            cp target/release/DaperZip.exe portable/DaperZip/ 2>/dev/null || cp target/release/daperzip.exe portable/DaperZip/DaperZip.exe
            cp vendor/7zip/windows-x64/* vendor/7zip/License.txt portable/DaperZip/7zip/
            cp LICENSE THIRD_PARTY_NOTICES.md portable/DaperZip/
            (cd portable && 7z a ../dist/DaperZip-portable-windows-x64.zip DaperZip >/dev/null)
          fi
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: daperzip-${{ matrix.sevenzip }}
          path: dist/*

  release:
    # tag pushed by hand, or a new version on main (see the version job)
    if: startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # Checksums so users can verify downloads (sha256sum -c SHA256SUMS).
      - name: Create SHA256SUMS
        run: cd dist && sha256sum * > SHA256SUMS

      # New version on main: create tag v<version> on this commit and publish.
      - name: Create release
        if: needs.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DaperZip ${{ needs.version.outputs.version }}
          body_path: ${{ needs.version.outputs.notes }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: dist/*
          fail_on_unmatched_files: true

      # Tag pushed by hand: attach the installers. If the release was created
      # on GitHub first, its title, notes and pre-release flag are kept.
      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
